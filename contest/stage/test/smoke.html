<script type="module">
// Checks the shared base: importmap, lib/clock.js hook, tools/render.mjs (stills and bench).
import * as THREE from "three";
import { runLoop } from "/lib/clock.js";
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.append(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 1, 5);
const cube = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshNormalMaterial());
scene.add(cube);
runLoop({ renderer, renderAt: (t) => { cube.rotation.set(t * 0.7, t, 0); renderer.render(scene, camera); } });
</script>
